<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Planilla (grid spreadsheet) -->
  <rect x="8" y="14" width="48" height="42" rx="4" fill="#fff" stroke="#2563eb" stroke-width="3"/>
  <!-- Header row -->
  <rect x="8" y="14" width="48" height="10" rx="4" fill="#2563eb"/>
  <rect x="8" y="20" width="48" height="4" fill="#2563eb"/>
  <!-- Grid lines -->
  <line x1="8" y1="30" x2="56" y2="30" stroke="#2563eb" stroke-width="2"/>
  <line x1="8" y1="40" x2="56" y2="40" stroke="#2563eb" stroke-width="2"/>
  <line x1="8" y1="50" x2="56" y2="50" stroke="#2563eb" stroke-width="2"/>
  <line x1="24" y1="24" x2="24" y2="56" stroke="#2563eb" stroke-width="2"/>
  <line x1="40" y1="24" x2="40" y2="56" stroke="#2563eb" stroke-width="2"/>
  <!-- Casco de obra -->
  <ellipse cx="32" cy="22" rx="16" ry="12" fill="#f59e0b" stroke="#d97706" stroke-width="2"/>
  <rect x="16" y="20" width="32" height="4" rx="2" fill="#d97706"/>
  <rect x="28" y="6" width="8" height="10" rx="3" fill="#f59e0b" stroke="#d97706" stroke-width="2"/>
</svg>
