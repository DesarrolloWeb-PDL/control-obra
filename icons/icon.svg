    <!-- Grid lines -->
    <line x1="8" y1="30" x2="56" y2="30" stroke="#e85d04" stroke-width="2"/>
    <line x1="8" y1="40" x2="56" y2="40" stroke="#e85d04" stroke-width="2"/>
    <line x1="8" y1="50" x2="56" y2="50" stroke="#e85d04" stroke-width="2"/>
    <line x1="24" y1="24" x2="24" y2="56" stroke="#e85d04" stroke-width="2"/>
    <line x1="40" y1="24" x2="40" y2="56" stroke="#e85d04" stroke-width="2"/>
    <!-- Casco de obra -->
    <ellipse cx="32" cy="22" rx="16" ry="12" fill="#f59e0b" stroke="#d97706" stroke-width="2"/>
    <rect x="16" y="20" width="32" height="4" rx="2" fill="#d97706"/>
